<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#f3ede1" />
    <script>
      // Apply the saved light/dark choice before first paint (see src/services/theme.js).
      try {
        if (localStorage.getItem('quiz_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171510');
        }
      } catch (e) {}
    </script>
    <!-- Google Identity Services (the sign-in button) is deliberately NOT loaded
         here - it's injected on demand, only after cookie consent is accepted,
         by services/loadScript.js (see HomeView.vue). Loading it unconditionally
         on every page would let it set cookies on Google's domain before anyone
         had a chance to consent to that. -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Undoes the encoding 404.html applied, restoring the real URL the
      // visitor actually requested (a deep link, or a page refresh on a
      // non-root route) before the Vue app itself loads and its router runs.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
    <!-- The three font files the first screen needs, fetched up front so text doesn't jump when they arrive -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="/assets/index-WSUW5RI_.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BTANeDe4.css">
  </head>
<body>
    <div id="app"></div>
</body>
</html>
