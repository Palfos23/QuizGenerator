<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>QuizMaker</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any URL it doesn't recognize as a
      // real static file - which, for a single-page app, is every in-app
      // route other than the homepage (e.g. a deep link, or a page refresh
      // on /tension). This encodes the real path into a query string and
      // redirects to the root, where the script in index.html decodes it
      // back into the real URL before the Vue app loads, so its own router
      // can render the correct page.
      //
      // pathSegmentsToKeep is 0 because this site is served from the root
      // of a custom domain (quizzes.no), not from a GitHub Pages project
      // subpath like username.github.io/repo-name - if that ever changes,
      // this needs to become 1 again.
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
</head>
<body>
</body>
</html>
