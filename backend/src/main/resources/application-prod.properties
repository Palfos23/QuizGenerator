# Activated on Render via the SPRING_PROFILES_ACTIVE=prod environment variable.
# Every value here comes from an env var you set in the Render dashboard - nothing
# sensitive is hardcoded, and nothing here needs to match what's in application.properties
# (which stays as the zero-setup local-dev defaults).

# --- Database: point this at your Neon or Supabase connection string ---
# Neon/Supabase give you a single connection string like:
#   postgresql://user:password@host/dbname?sslmode=require
# Spring's JDBC driver wants the jdbc: prefix, so set DATABASE_URL to:
#   jdbc:postgresql://host/dbname?sslmode=require&user=user&password=password
# (or keep user/password separate via DATABASE_USERNAME / DATABASE_PASSWORD below -
# whichever your provider's copy-paste connection string gives you most easily).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Set explicitly so Hibernate skips its own "probe the DB to guess the dialect" step.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 console has no purpose against a real Postgres datasource - fully disabled in prod.
spring.h2.console.enabled=false

# Keep ddl-auto=update for now (matches the dev profile) - see the README note about
# switching to Flyway/Liquibase once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Off by default Spring Boot leaves this on, which lets database queries run during
# view rendering (masking N+1 issues) and holds each request's DB connection open
# longer than necessary. Neither is needed here, and turning it off was already
# flagged as a startup warning in the logs.
spring.jpa.open-in-view=false

# Tomcat's default max thread pool is 200, each reserving its own stack (~1MB).
# This used to be capped at 20 to fit a 512Mi (Starter) container - now that
# this runs on a 2GB (Standard) instance, 100 gives real headroom for several
# online-game rooms' worth of players hitting the API at once (broadcast-
# triggered bursts - e.g. every player's suggestion-list fetch firing at the
# same moment a round starts - plus WebSocket-fallback polling if sockets
# can't hold) without getting anywhere near starving thread stacks of the
# heap Dockerfile's -Xmx/-XX:MaxMetaspaceSize leave for them. Still well under
# Tomcat's own 200 default; raise further only if real traffic needs it.
server.tomcat.threads.max=100

# The database's session pooler (Supabase) allows only 15 clients in total
# ("EMAXCONNSESSION ... pool_size: 15") - exceeding that makes startup fail
# outright, which took the backend down on 2026-10-03 when this was 20.
# Render's zero-downtime deploys also run the OLD and NEW instance side by
# side for a while, and each one holds its own pool, so the budget is
# 2 x maximum-pool-size, not 1 x: 2 x 6 = 12 leaves 3 spare for anything
# else connecting (admin tools, a local dev run). minimum-idle is kept low so
# an idle instance doesn't sit on all 6. Don't raise these without checking
# the pooler's actual limit first (or switching to its transaction-mode port,
# which allows far more clients but needs prepareThreshold=0 on the JDBC URL).
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=2
# Wait up to 60s for the very first connection instead of crashing on the first
# refusal - a "max clients reached" at startup is often just the previous
# instance (or a lingering session) still releasing its connections.
spring.datasource.hikari.initialization-fail-timeout=60000
# Required if DATABASE_URL ever points at Supabase's transaction-mode pooler
# (port 6543), which can't keep server-side prepared statements; harmless on
# session mode too (just skips the statement cache).
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# --- CORS: comma-separated list, e.g. https://your-user.github.io ---
quiz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Auth ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.google.client-id=${GOOGLE_CLIENT_ID}
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# --- Email (Gmail SMTP) - sends password-reset and verify-your-email links ---
# Same Gmail address + App password as local dev (or a dedicated account, so
# personal-inbox traffic and app traffic stay separate) - set MAIL_USERNAME /
# MAIL_APP_PASSWORD in the Render dashboard.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Change via MAIL_FROM_NAME in the Render dashboard if you want something other
# than "Quizzes" shown as the sender name - see application.properties' comment
# on why only the display name (not the address) can be customized on Gmail SMTP.
app.mail.from-name=${MAIL_FROM_NAME:Quizzes}

# The deployed frontend's URL (e.g. https://quizzes.no) - used to build the link
# inside a password-reset email. Must not have a trailing slash. Defaulted (unlike
# JWT_SECRET/CORS_ALLOWED_ORIGINS above, which the app can't safely guess and so
# deliberately still hard-fail without) so a missing env var here degrades to a
# wrong-but-working reset link instead of refusing to boot at all - this crashed
# the whole app on 2026-09-07 when FRONTEND_BASE_URL wasn't set yet. Override with
# the real one in the Render dashboard.
app.frontend-base-url=${FRONTEND_BASE_URL:https://quizzes.no}

# --- Birthday quiz (one-off, delete together with the rest of the Bday* files) ---
# Defaulted to empty (unlike JWT_SECRET/CORS_ALLOWED_ORIGINS above) so a missing
# BDAY_PASSWORD degrades to the /bday feature just staying locked out (every
# request 401s - BdayPinAuthFilter treats a blank configured PIN as "reject
# everything") instead of refusing to boot the entire app - this crashed the
# whole app on 2026-09-23 when BDAY_PASSWORD wasn't set yet, same class of
# mistake as FRONTEND_BASE_URL above. Set BDAY_PASSWORD in the Render dashboard.
app.birthday.password=${BDAY_PASSWORD:}
