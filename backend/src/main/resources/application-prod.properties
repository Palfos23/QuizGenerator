# Activated on Render via the SPRING_PROFILES_ACTIVE=prod environment variable.
# Every value here comes from an env var you set in the Render dashboard - nothing
# sensitive is hardcoded, and nothing here needs to match what's in application.properties
# (which stays as the zero-setup local-dev defaults).

# --- Database: point this at your Neon or Supabase connection string ---
# Neon/Supabase give you a single connection string like:
#   postgresql://user:password@host/dbname?sslmode=require
# Spring's JDBC driver wants the jdbc: prefix, so set DATABASE_URL to:
#   jdbc:postgresql://host/dbname?sslmode=require&user=user&password=password
# (or keep user/password separate via DATABASE_USERNAME / DATABASE_PASSWORD below -
# whichever your provider's copy-paste connection string gives you most easily).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Set explicitly so Hibernate skips its own "probe the DB to guess the dialect" step.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 console has no purpose against a real Postgres datasource - fully disabled in prod.
spring.h2.console.enabled=false

# Keep ddl-auto=update for now (matches the dev profile) - see the README note about
# switching to Flyway/Liquibase once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Off by default Spring Boot leaves this on, which lets database queries run during
# view rendering (masking N+1 issues) and holds each request's DB connection open
# longer than necessary. Neither is needed here, and turning it off was already
# flagged as a startup warning in the logs.
spring.jpa.open-in-view=false

# Tomcat's default max thread pool is 200, each reserving its own stack (~1MB) -
# far more than this app's actual traffic needs, and meaningful overhead on a
# small (512Mi) container. 20 is comfortably more than enough headroom for a
# personal/small-group app; raise this if real concurrent traffic ever needs it.
server.tomcat.threads.max=20

# --- CORS: comma-separated list, e.g. https://your-user.github.io ---
quiz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Auth ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.google.client-id=${GOOGLE_CLIENT_ID}
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# --- Email (Gmail SMTP) - sends password-reset and verify-your-email links ---
# Same Gmail address + App password as local dev (or a dedicated account, so
# personal-inbox traffic and app traffic stay separate) - set MAIL_USERNAME /
# MAIL_APP_PASSWORD in the Render dashboard.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Change via MAIL_FROM_NAME in the Render dashboard if you want something other
# than "Quizzes" shown as the sender name - see application.properties' comment
# on why only the display name (not the address) can be customized on Gmail SMTP.
app.mail.from-name=${MAIL_FROM_NAME:Quizzes}

# The deployed frontend's URL (e.g. https://quizzes.no) - used to build the link
# inside a password-reset email. Must not have a trailing slash. Defaulted (unlike
# JWT_SECRET/CORS_ALLOWED_ORIGINS above, which the app can't safely guess and so
# deliberately still hard-fail without) so a missing env var here degrades to a
# wrong-but-working reset link instead of refusing to boot at all - this crashed
# the whole app on 2026-09-07 when FRONTEND_BASE_URL wasn't set yet. Override with
# the real one in the Render dashboard.
app.frontend-base-url=${FRONTEND_BASE_URL:https://quizzes.no}
